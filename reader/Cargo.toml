[package]
name = "report-reader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "reader"
path = "src/main.rs"

[[bin]]
name = "report-server"
path = "src/server.rs"

[dependencies]
axum = "0.8"
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs"] }
webbrowser = "1"
