[package]
name = "apple-message-forensics"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
maud = "0.27.0"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
zip = { version = "2.4.0", features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
